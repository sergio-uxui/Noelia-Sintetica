[build]
builder = "NIXPACKS"

[deploy]
startCommand = "streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"

[[volumes]]
# Disco persistente para la base de datos SQLite
mountPath = "/data"
